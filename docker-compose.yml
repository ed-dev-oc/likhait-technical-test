services:
  db:
    image: mysql:8.0
    container_name: expense_system_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_system_backend
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DB_NAME}
      # SECURITY: Uses the least-privilege expense_user, not root.
      DATABASE_USERNAME: ${DB_USERNAME}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Manila
      APP_TIMEZONE: Asia/Manila
      # CORS: Restricts which frontend origins can call the API.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/rails
      - backend_gems:/usr/local/bundle
    command: >
      sh -c "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        rails db:prepare &&
        rails server -b 0.0.0.0
      "
    networks:
      - expense_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_system_frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host
    networks:
      - expense_network

volumes:
  mysql_data:
  backend_gems:
  frontend_node_modules:

networks:
  expense_network:
    driver: bridge
